<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>EDGERUN art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>html, body { margin: 0; background: #ff3d9a; } canvas { display: block; }</style>
<canvas id="out"></canvas>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
// The brand's key art, rendered rather than drawn.
//
// Every picture here is the same small world: the brain mark and a few plain objects, glossy,
// on nothing, lit like a product shot. Each is rendered with a transparent ground that only
// catches the shadow, so one PNG sits on the pink field, the bone field or the dark one
// without being re-rendered.
//
// Soft shadows are bought with time instead of a renderer: the scene is drawn many times
// with the key light moved across a disc, and the frames are averaged. Sixty-four frames of
// a hard shadow is an area light.
//
//   scripts/art/render.mjs            renders every scene to frontend/public/art/
//   render.html?scene=brain&w=1600&h=1600&samples=64   one scene, in a browser, to look at
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const Q = new URLSearchParams(location.search);
const W = Number(Q.get("w") || 1400), H = Number(Q.get("h") || 1400);
const SAMPLES = Number(Q.get("samples") || 48);

const PINK = 0xff3d9a, DEEP = 0xb30a55, BONE = 0xfff4ea, INK = 0x1c0712;

const gloss = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.22, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12, ...extra });
const clay = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.62, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.5, ...extra });
const chrome = () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.08, metalness: 1 });

const mark = await (await fetch("./mark.json")).json();
await document.fonts.load('800 120px "Bricolage Grotesque"');

/** The mark as a solid: bone faces, pink sides. `size` is its height in world units. */
function brain({ size = 2, depth = 0.34, face = gloss(BONE), side = gloss(DEEP) } = {}) {
  const group = new THREE.Group();
  for (const poly of mark.faces) {
    const shape = new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(x, y)));
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 5, curveSegments: 1 });
    geo.translate(0, 0, -depth / 2);
    group.add(new THREE.Mesh(geo, [face, side]));
  }
  // the traced mark spans roughly -0.66..0.66; scale so its height is `size`
  const box = new THREE.Box3().setFromObject(group);
  const h = box.max.y - box.min.y;
  group.scale.setScalar(size / h);
  group.userData.height = size;
  group.userData.bottom = box.min.y * (size / h);
  return group;
}

/** Text as a texture, for anything printed or engraved. */
function label(lines, { w = 512, h = 512, color = "#1c0712", bg = null, size = 120, weight = 800, align = "center", gap = 1.05 } = {}) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.fillStyle = color;
  g.textAlign = align; g.textBaseline = "middle";
  const list = [].concat(lines).map((l) => (typeof l === "string" ? { text: l } : l));
  const total = list.reduce((s, l) => s + (l.size || size) * gap, 0);
  let y = h / 2 - total / 2;
  for (const l of list) {
    const px = l.size || size;
    g.font = `${l.weight || weight} ${px}px "Bricolage Grotesque", system-ui, sans-serif`;
    g.fillStyle = l.color || color;
    y += (px * gap) / 2;
    const x = align === "center" ? w / 2 : align === "left" ? w * 0.08 : w * 0.92;
    g.fillText(l.text, x, y);
    if (l.strike) { const m = g.measureText(l.text); g.fillRect(x - m.width / 2 - 8, y - px * 0.06, m.width + 16, px * 0.11); }
    y += (px * gap) / 2;
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/** A flat printed face laid just in front of something. */
function decal(texture, w, h) {
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: texture, transparent: true, toneMapped: false }));
}

const SCENES = {
  // the mark, standing, three-quarter view. The hero.
  brain(scene) {
    const b = brain({ size: 2.5, depth: 0.5 });
    b.position.y = -b.userData.bottom * 1 + 0.02;
    b.rotation.y = -0.5;
    b.rotation.x = -0.06;
    scene.add(b);
    return { look: [0.05, 1.22, 0], cam: [0.4, 1.75, 11.4], fov: 22 };
  },

  // the mark face-on, for an icon
  icon(scene) {
    const b = brain({ size: 2.5, depth: 0.42 });
    b.position.y = -b.userData.bottom + 0.02;
    b.rotation.y = -0.22;
    scene.add(b);
    return { look: [0, 1.25, 0], cam: [0, 1.45, 9.6], fov: 22 };
  },

  // three stones for three tokens nobody trades any more
  graves(scene) {
    const stone = (x, z, h, w, turn, lines) => {
      const s = new THREE.Shape();
      const r = w / 2;
      s.moveTo(-r, 0); s.lineTo(r, 0); s.lineTo(r, h - r); s.absarc(0, h - r, r, 0, Math.PI, false); s.lineTo(-r, 0);
      const d = 0.3;
      const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 6, curveSegments: 40 });
      geo.translate(0, 0, -d / 2);
      const m = new THREE.Mesh(geo, clay(BONE));
      const g = new THREE.Group();
      g.add(m);
      const face = decal(label(lines, { w: 512, h: Math.round(512 * (h / w)), color: "#d9186f", size: 96 }), w * 0.92, h * 0.92);
      face.position.set(0, h / 2, d / 2 + 0.045);
      g.add(face);
      g.position.set(x, 0, z);
      g.rotation.y = turn;
      scene.add(g);
    };
    const rip = { text: "R.I.P.", size: 54, color: "#e86aa6" };
    stone(-1.85, 0.25, 1.9, 1.3, 0.3, [rip, { text: "$MOON", size: 104 }]);
    stone(0, -0.35, 2.5, 1.45, 0.04, [rip, { text: "$SAFE", size: 112 }]);
    stone(1.9, 0.3, 1.6, 1.25, -0.32, [rip, { text: "$100X", size: 100 }]);
    return { look: [0, 1.1, 0], cam: [1.6, 2.3, 13.6], fov: 24 };
  },

  // five wallets, one hand: balloons on strings that all end at the same weight
  strings(scene) {
    const anchor = new THREE.Mesh(new RoundedBoxGeometry(0.9, 0.62, 0.9, 6, 0.12), clay(BONE));
    anchor.position.set(0, 0.31, 0);
    scene.add(anchor);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 12, 32), chrome());
    ring.position.set(0, 0.72, 0);
    scene.add(ring);
    const spots = [[-1.9, 2.6, 0.2, 0.6], [-0.95, 3.5, -0.3, 0.72], [0.1, 2.9, 0.35, 0.56], [1.05, 3.65, -0.2, 0.7], [1.95, 2.7, 0.15, 0.6]];
    spots.forEach(([x, y, z, r], i) => {
      const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 64, 48), gloss(i === 2 ? BONE : PINK));
      ball.scale.y = 1.12;
      ball.position.set(x, y, z);
      scene.add(ball);
      const knot = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.12, 16), gloss(i === 2 ? BONE : PINK));
      knot.position.set(x, y - r * 1.12 - 0.03, z);
      scene.add(knot);
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(x, y - r * 1.12 - 0.06, z),
        new THREE.Vector3(x * 0.72, (y + 0.8) / 2, z * 0.7),
        new THREE.Vector3(0, 0.76, 0),
      ]);
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.014, 8), new THREE.MeshStandardMaterial({ color: DEEP, roughness: 0.6 })));
    });
    return { look: [0, 2.0, 0], cam: [0.6, 2.4, 14.2], fov: 24, shadow: 0x000000 };
  },

  // one ticker, several mints: five coins with the same face, and only one of them is it
  coins(scene) {
    const coin = (x, z, turn, real) => {
      const r = 0.82, d = 0.2;
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d, 96, 1), gloss(real ? PINK : BONE));
      body.rotation.x = Math.PI / 2;
      g.add(body);
      const rimGeo = new THREE.TorusGeometry(r - 0.045, 0.045, 16, 96);
      for (const side of [1, -1]) {
        const rimMesh = new THREE.Mesh(rimGeo, gloss(real ? PINK : BONE));
        rimMesh.position.z = side * d / 2;
        g.add(rimMesh);
      }
      const face = decal(label([{ text: "$CAT", size: 150 }], { w: 512, h: 512, color: real ? "#fff4ea" : "#d9186f" }), r * 1.7, r * 1.7);
      face.position.z = d / 2 + 0.012;
      g.add(face);
      g.position.set(x, r + 0.01, z);
      g.rotation.y = turn;
      scene.add(g);
    };
    coin(-2.25, 0.2, 0.5, false);
    coin(-1.15, -0.45, 0.3, false);
    coin(0, 0.55, 0.0, true);
    coin(1.15, -0.45, -0.3, false);
    coin(2.25, 0.2, -0.5, false);
    return { look: [0, 0.8, 0], cam: [0.4, 2.6, 16.5], fov: 24 };
  },

  // what the post says, and what the wallet did
  receipt(scene) {
    // a speech bubble
    const bw = 2.5, bh = 1.5, r = 0.36;
    const s = new THREE.Shape();
    s.moveTo(-bw / 2 + r, 0); s.lineTo(-0.5, 0); s.lineTo(-0.85, -0.55); s.lineTo(-0.05, 0); s.lineTo(bw / 2 - r, 0);
    s.absarc(bw / 2 - r, r, r, -Math.PI / 2, 0, false); s.lineTo(bw / 2, bh - r);
    s.absarc(bw / 2 - r, bh - r, r, 0, Math.PI / 2, false); s.lineTo(-bw / 2 + r, bh);
    s.absarc(-bw / 2 + r, bh - r, r, Math.PI / 2, Math.PI, false); s.lineTo(-bw / 2, r);
    s.absarc(-bw / 2 + r, r, r, Math.PI, Math.PI * 1.5, false);
    const d = 0.34;
    const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 8, curveSegments: 24 });
    geo.translate(0, 0, -d / 2);
    const bubble = new THREE.Group();
    bubble.add(new THREE.Mesh(geo, gloss(DEEP)));
    const say = decal(label([{ text: "BUY NOW", size: 150 }], { w: 1024, h: 512, color: "#fff1e4" }), bw * 0.9, bw * 0.45);
    say.position.set(0, bh / 2, d / 2 + 0.065);
    bubble.add(say);
    bubble.position.set(-1.05, 1.55, 0);
    bubble.rotation.set(0, 0.3, 0.05);
    scene.add(bubble);

    // a till receipt, standing on its curl
    const rw = 1.5, rh = 2.6;
    const paper = new THREE.PlaneGeometry(rw, rh, 24, 60);
    const pos = paper.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      pos.setZ(i, Math.sin((y / rh + 0.5) * Math.PI * 1.15) * 0.22 + Math.sin((y / rh) * 9) * 0.02);
    }
    paper.computeVertexNormals();
    const tex = label([
      { text: "RECEIPT", size: 64, color: "#b9a79c" },
      { text: "- - - - - - - -", size: 44, color: "#d8c9bf" },
      { text: "SOLD", size: 190, color: "#d9186f" },
      { text: "- - - - - - - -", size: 44, color: "#d8c9bf" },
      { text: "same wallet", size: 62, color: "#1c0712" },
      { text: "same day", size: 62, color: "#1c0712" },
    ], { w: 600, h: 1040, bg: "#fff8f1", size: 60 });
    const slip = new THREE.Mesh(paper, new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.75, side: THREE.DoubleSide }));
    slip.position.set(1.35, 1.34, 0.25);
    slip.rotation.set(-0.05, -0.38, -0.05);
    scene.add(slip);
    return { look: [0.15, 1.5, 0], cam: [0.3, 1.9, 13.6], fov: 24 };
  },
};

async function render(name) {
  const make = SCENES[name];
  if (!make) throw new Error(`no scene called ${name}`);
  const canvas = document.createElement("canvas");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  // the neutral curve, not the filmic one: filmic greys out a white and shifts the pink,
  // and these are brand colours that have to come out as themselves
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;
  scene.environmentIntensity = 0.7;

  const view = make(scene);
  scene.traverse((o) => { if (o.isMesh && !o.material.isMeshBasicMaterial) { o.castShadow = true; o.receiveShadow = true; } });

  // the ground is nothing but the shadow that falls on it
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ color: view.shadow ?? 0x5e0733, opacity: 0.36 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // bounce: pink from below, white from above
  scene.add(new THREE.HemisphereLight(0xffffff, 0xff7fbd, 1.15));
  const key = new THREE.DirectionalLight(0xfff6ee, 2.2);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  const sc = key.shadow.camera;
  sc.left = -7; sc.right = 7; sc.top = 7; sc.bottom = -7; sc.near = 0.5; sc.far = 40;
  scene.add(key, key.target);
  const rim = new THREE.DirectionalLight(0xff9fd0, 1.1);
  rim.position.set(5, 3, -6);
  scene.add(rim);

  const camera = new THREE.PerspectiveCamera(view.fov, W / H, 0.1, 100);
  camera.position.set(...view.cam);
  camera.lookAt(...view.look);

  // Averaged in floats and read straight off the drawing buffer. Blending frames onto a 2D
  // canvas would be simpler and is wrong exactly where it matters: a transparent pixel drawn
  // "over" an accumulated one leaves it untouched instead of pulling it toward nothing, so
  // every shadow edge would come out darker than the average.
  const gl = renderer.getContext();
  const frame = new Uint8Array(W * H * 4);
  const sum = new Float32Array(W * H * 4);
  const base = new THREE.Vector3(-5.5, 9.5, 6.5);
  for (let i = 0; i < SAMPLES; i++) {
    // a disc of light positions, walked by a golden-angle spiral so any prefix is even
    const rad = 1.9 * Math.sqrt((i + 0.5) / SAMPLES), ang = i * 2.39996323;
    key.position.set(base.x + Math.cos(ang) * rad, base.y, base.z + Math.sin(ang) * rad);
    // and the camera a fraction of a pixel, which is the antialiasing
    camera.setViewOffset(W, H, (((i * 0.618) % 1) - 0.5), (((i * 0.382) % 1) - 0.5), W, H);
    renderer.render(scene, camera);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, frame);
    for (let k = 0; k < frame.length; k++) sum[k] += frame[k];
    if (i % 8 === 7) await new Promise((r) => setTimeout(r, 0));
  }
  renderer.dispose();

  // the buffer is premultiplied and bottom-up; a PNG is neither
  const out = document.getElementById("out");
  out.width = W; out.height = H;
  out.style.width = `${Math.min(W, 900)}px`;
  const image = new ImageData(W, H);
  for (let y = 0; y < H; y++) {
    const from = (H - 1 - y) * W * 4, to = y * W * 4;
    for (let x = 0; x < W; x++) {
      const a = sum[from + x * 4 + 3] / SAMPLES;
      const un = a > 0 ? 255 / a : 0;
      image.data[to + x * 4] = Math.min(255, (sum[from + x * 4] / SAMPLES) * un);
      image.data[to + x * 4 + 1] = Math.min(255, (sum[from + x * 4 + 1] / SAMPLES) * un);
      image.data[to + x * 4 + 2] = Math.min(255, (sum[from + x * 4 + 2] / SAMPLES) * un);
      image.data[to + x * 4 + 3] = a;
    }
  }
  out.getContext("2d").putImageData(image, 0, 0);
  return out.toDataURL("image/png");
}

window.__scenes = Object.keys(SCENES);
window.__render = render;
if (Q.get("scene")) { await render(Q.get("scene")); window.__done = true; }
</script>
</html>
