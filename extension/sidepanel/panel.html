<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDGERUN</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="" width="22" height="22" />
        <b>EDGERUN</b>
      </div>
      <button id="theme" class="ghost icon" title="Switch theme" aria-label="Switch theme">◐</button>
      <button id="clear" class="ghost" title="Forget this tab's session">clear</button>
    </header>

    <form class="check" id="check">
      <input id="q" placeholder="paste a contract address" spellcheck="false" autocomplete="off" />
      <button class="go" type="submit">check</button>
    </form>
    <p class="err" id="err" hidden></p>

    <nav class="tabs" role="tablist">
      <button class="tab on" data-filter="all" role="tab">session <span class="n" id="n-all">0</span></button>
      <button class="tab" data-filter="flagged" role="tab">flagged <span class="n bad" id="n-flagged">0</span></button>
      <button class="tab" data-filter="watch" role="tab">watching <span class="n" id="n-watch">0</span></button>
      <button class="tab" data-filter="callers" role="tab">callers <span class="n" id="n-callers">0</span></button>
    </nav>

    <p class="where" id="where"></p>

    <!-- Shown only on the callers tab. The graph is the most personal thing the extension
         holds, so the controls for it sit on top of it rather than buried in a settings
         screen: what is stored, a switch, and a way to destroy it. -->
    <div class="privacy" id="privacy" hidden>
      <p id="privacy-say">stays on this machine. there is no server to send it to.</p>
      <div class="privacy-acts">
        <button id="graph-pause" class="ghost">pause</button>
        <button id="graph-wipe" class="ghost danger">forget everyone</button>
      </div>
    </div>

    <main id="list" class="list" aria-live="polite"></main>

    <template id="empty-none">
      <div class="empty">
        <b>nothing checked yet</b>
        <span>Scroll a timeline, open a token on the explorer, or paste an address above. Everything this tab checks lands here, in order.</span>
      </div>
    </template>

    <template id="empty-clean">
      <div class="empty">
        <b>nothing flagged</b>
        <span>Every token checked on this tab so far came back without a failing check.</span>
      </div>
    </template>

    <template id="empty-watch">
      <div class="empty">
        <b>not watching anything</b>
        <span>Hit watch on any token and it lands here, rechecked each time you open this tab.</span>
      </div>
    </template>

    <template id="empty-callers">
      <div class="empty">
        <b>nobody recorded yet</b>
        <span>Scroll a timeline on X. Every account that posts a contract address lands here, with what those contracts came back as. Nothing is recorded for a post that only names a ticker.</span>
      </div>
    </template>

    <template id="empty-paused">
      <div class="empty">
        <b>recording is paused</b>
        <span>Accounts posting contracts are not being logged. Anything recorded before you paused is still here.</span>
      </div>
    </template>

    <footer class="foot">
      <span id="stat-registry" class="stat">registry -</span>
      <span id="stat-block" class="stat">blocklist -</span>
      <span id="stat-budget" class="stat">budget -</span>
    </footer>

    <script src="panel.js" type="module"></script>
  </body>
</html>
