<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDGERUN</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="" width="22" height="22" />
        <b>EDGERUN</b>
      </div>
      <button id="theme" class="ghost icon" title="Switch theme" aria-label="Switch theme">◐</button>
      <button id="clear" class="ghost" title="Forget this tab's session">clear</button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab on" data-filter="all" role="tab">everything <span class="n" id="n-all">0</span></button>
      <button class="tab" data-filter="flagged" role="tab">flagged <span class="n bad" id="n-flagged">0</span></button>
    </nav>

    <p class="where" id="where"></p>

    <main id="list" class="list" aria-live="polite"></main>

    <template id="empty-none">
      <div class="empty">
        <b>nothing checked yet</b>
        <span>Scroll a timeline, or open a token on the explorer. Everything this tab checks lands here, in order.</span>
      </div>
    </template>

    <template id="empty-clean">
      <div class="empty">
        <b>nothing flagged</b>
        <span>Every token checked on this tab so far came back without a failing check.</span>
      </div>
    </template>

    <footer class="foot">
      <span id="stat-registry" class="stat">registry -</span>
      <span id="stat-block" class="stat">blocklist -</span>
      <span id="stat-budget" class="stat">budget -</span>
    </footer>

    <script src="panel.js" type="module"></script>
  </body>
</html>
