<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EDGERUN</title>
<style>
  :root {
    --ink: #151a11; --muted: #5d6752; --line: #e3e7d9; --card: #fff; --soft: #f6f8f0;
    --bad: #c62828; --warn: #a15c07; --ok: #4a7c0f; --signal: #cfff04;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { width: 440px; margin: 0; background: var(--soft); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }

  header { display: flex; align-items: center; gap: 10px; padding: 16px 18px; background: var(--card);
    border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; font-weight: 800; letter-spacing: 0.14em; }
  header .reg { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  /* the one entry point to the sidebar that is guaranteed to carry a user gesture */
  header .side { padding: 7px 12px; font-size: 12.5px; }

  form { display: flex; gap: 9px; padding: 16px 18px; background: var(--card); border-bottom: 1px solid var(--line); }
  input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; outline: none; }
  input:focus { border-color: #a9c96a; box-shadow: 0 0 0 3px rgba(207,255,4,.28); }
  input::placeholder { color: #9aa48c; }

  button { font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 12px 18px;
    border-radius: 10px; color: var(--ink); background: var(--card); border: 1px solid var(--line); }
  button:hover { background: #eef2e4; }
  button.go { background: var(--signal); border-color: #b9e604; color: #131a02; }
  button.go:hover { filter: brightness(1.04); }
  button:disabled { opacity: .55; cursor: default; }

  #out:not(:empty) { background: var(--card); border-bottom: 1px solid var(--line); padding: 4px 0 14px; }
  .v { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 999px; color: #fff; background: var(--muted); }
  .v.FAIL { background: var(--bad); } .v.CAUTION { background: var(--warn); }
  .v.PASS, .v.OFFICIAL { background: var(--ok); }
  .top { display: flex; align-items: center; gap: 11px; padding: 16px 18px 10px; }
  .top b { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .lead { margin: 0; padding: 0 18px 12px; font-size: 15px; }
  .row { display: grid; grid-template-columns: 10px 1fr; gap: 12px; padding: 9px 18px; }
  .row i { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: #b9c0aa; }
  .row i.ok { background: var(--ok); } .row i.fail { background: var(--bad); } .row i.warn { background: var(--warn); }
  .row b { display: block; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 2px; }
  .row span { display: block; font-size: 14px; }
  .acts { display: flex; gap: 9px; align-items: center; padding: 12px 18px 4px; }
  .acts a { font-size: 14px; font-weight: 700; color: var(--ok); text-decoration: none; }
  .err { margin: 0; padding: 16px 18px; color: var(--bad); font-weight: 600; }

  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    margin: 0; padding: 16px 18px 8px; }
  ul { list-style: none; margin: 0; padding: 0 18px 16px; }
  li { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  li a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ok); text-decoration: none; }
  li button { padding: 7px 12px; font-size: 12.5px; }
  .quiet { color: #9aa48c; font-size: 14px; padding: 12px 0; }

  footer { padding: 14px 18px 18px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
</style>
</head>
<body>
  <header><b>EDGERUN</b><span class="reg" id="reg">registry…</span><button class="side" id="side" type="button">sidebar</button></header>
  <form id="f">
    <input id="q" placeholder="paste a token address - 0x…" spellcheck="false" autocomplete="off" />
    <button class="go" id="go" type="submit">check</button>
  </form>
  <div id="out"></div>
  <h2>watching</h2>
  <ul id="watch"></ul>
  <footer>
    Checks run in your browser against Robinhood Chain and Robinhood's published stock-token
    registry. No account, no server, and the watchlist never leaves this machine.
  </footer>
  <script src="popup.js"></script>
</body>
</html>
