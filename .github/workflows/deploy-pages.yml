# Builds frontend/ as a static export and publishes it to GitHub Pages.
#
# One-time setup before this runs successfully:
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables tab, add:
#      NEXT_PUBLIC_BASE_PATH and NEXT_PUBLIC_SITE_URL are NOT variables. They are derived
#      from frontend/public/CNAME at build time - see the "Work out where this is being
#      served from" step. To move the site, change that one file.
#        NEXT_PUBLIC_EDGERUN_CONTRACT_ADDRESS (optional - set once the token deploys)
#        NEXT_PUBLIC_EDGERUN_DEX_URL          (optional - set once the token deploys)
#        NEXT_PUBLIC_EDGERUN_TICKER           (optional - defaults to $EDGERUN)
#        NEXT_PUBLIC_GITHUB_REPO_URL          (optional - this repo's URL, for the
#                                               "verify it yourself" section)
# These are all NEXT_PUBLIC_* values baked into the public client bundle anyway,
# so plain repo Variables (not Secrets) are the right place for them.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Work out where this is being served from
        id: where
        run: |
          # frontend/public/CNAME is the single source of truth for the deploy target.
          # Present  -> a custom domain serving from the root: no base path.
          # Absent   -> the project page at <user>.github.io/<repo>: base path is the repo.
          # Switching domains is then a one-line change to one file, and the site, the og
          # images and the asset paths cannot disagree about where they are.
          if [ -s frontend/public/CNAME ]; then
            domain="$(tr -d '[:space:]' < frontend/public/CNAME)"
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$domain" >> "$GITHUB_OUTPUT"
            echo "serving from the custom domain $domain"
          else
            echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${GITHUB_REPOSITORY%%/*}.github.io" >> "$GITHUB_OUTPUT"
            echo "serving from the project page"
          fi

      - name: Build static export
        working-directory: frontend
        env:
          # Derived from the CNAME file by the step above, not from a repo variable. A
          # variable could not express "custom domain" anyway: an empty BASE_PATH is falsy, so
          # `vars.X || default` can never be overridden back to empty, which is exactly the
          # value a domain at the root needs.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.where.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.where.outputs.site_url }}
          NEXT_PUBLIC_EDGERUN_CONTRACT_ADDRESS: ${{ vars.NEXT_PUBLIC_EDGERUN_CONTRACT_ADDRESS }}
          NEXT_PUBLIC_EDGERUN_DEX_URL: ${{ vars.NEXT_PUBLIC_EDGERUN_DEX_URL }}
          NEXT_PUBLIC_EDGERUN_TICKER: ${{ vars.NEXT_PUBLIC_EDGERUN_TICKER }}
          NEXT_PUBLIC_GITHUB_REPO_URL: ${{ vars.NEXT_PUBLIC_GITHUB_REPO_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
